[package]
name = "craft-codex-bridge"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
description = "Owned Codex app-server driver and bounded protocol adapter; independent of Craft"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Security"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[bin]]
name = "codex-app-server-driver"
path = "src/bin/codex-app-server-driver.rs"

[features]
fixtures = []
