[package]
name = "craft-pi-executor"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"

[dependencies]
craft-pi-bridge = { path = "../craft-pi-bridge" }
craft-anything-ai = { path = "../craft-anything-adapted/crates/ai" }
craft-anything-engine = { path = "../craft-anything-adapted/crates/engine" }
craft-anything-evidence = { path = "../craft-anything-adapted/crates/evidence" }
craft-anything-platform = { path = "../craft-anything-adapted/crates/platform" }
craft-anything-mcp = { path = "../craft-anything-adapted/crates/mcp" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"

[profile.dev]
debug = 0

[features]
fixtures = []

[[bin]]
name = "offline-pi-peer"
path = "tests/fixtures/offline-pi-peer.rs"
required-features = ["fixtures"]

[[bin]]
name = "probe-fixture"
path = "tests/fixtures/probe.rs"
required-features = ["fixtures"]

[[bin]]
name = "craft-pi-executor"
path = "src/main.rs"
