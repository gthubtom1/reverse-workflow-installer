name: offline-tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unittest:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Fetch exact public v0.6.1 reader for compatibility regression
        shell: pwsh
        run: |
          git fetch --no-tags --depth=1 origin refs/tags/v0.6.1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $legacy = (git rev-parse 'FETCH_HEAD^{commit}').Trim()
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ($legacy -ne '02341811920dc419eb4af27eb836f8e683eddc96') { throw 'Public v0.6.1 tag identity changed' }
      - name: Select preinstalled Python
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TOOL_CACHE "Python/${{ matrix.python }}*"
          $versions = Get-ChildItem $exe -Directory | Sort-Object Name -Descending
          if (!$versions) { throw 'Requested preinstalled Python is unavailable' }
          $pythonRoot = Join-Path $versions[0].FullName 'x64'
          if ($IsWindows) { $python = Join-Path $pythonRoot 'python.exe' }
          else { $python = Join-Path $pythonRoot 'bin/python' }
          & $python -B -m unittest discover -s tests -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
  pi-grill-skills:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Check Pi grilling scripts
        shell: bash
        run: |
          node --version
          node --check scripts/pi-grill-common.mjs
          node --check scripts/pi-adapt-grill-skills.mjs
          node --check scripts/verify-pi-grill-skills.mjs
          node --check tests/pi-grill-skills.test.mjs
      - name: Run offline Pi grilling fixtures
        shell: bash
        run: node --test tests/pi-grill-skills.test.mjs
